apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: fitbeat
spec:
  replicas: 4
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values: ["user-service"]
              topologyKey: "kubernetes.io/hostname"
      containers:
      - name: user-service
        image: kguzmand/fitbeat-user-service:latest
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          value: "postgresql://postgres:postgres@postgres-service:5432/fitbeat_users"
        - name: REDIS_URL
          value: "redis://redis-service:6379/0"
        - name: INSTANCE_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: fitbeat
spec:
  type: NodePort
  selector:
    app: user-service
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30081