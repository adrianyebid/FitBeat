http:
  routers:
    # ── WebSocket: va DIRECTO al music service (KrakenD no soporta WS upgrade) ──
    ws-http:
      entryPoints:
        - web
      rule: Path(`/api/v1/ws`)
      service: music-service-svc
      priority: 20

    # ── OAuth Spotify: login y callback van DIRECTO a FastAPI (prioridad alta) ──
    # KrakenD no pasa redirects 3xx al browser — estos endpoints los necesitan.
    oauth-http:
      entryPoints:
        - web
      rule: >-
        PathPrefix(`/auth/login`) ||
        PathPrefix(`/auth/callback`)
      service: user-service-svc
      priority: 20

    oauth-https:
      entryPoints:
        - websecure
      rule: >-
        PathPrefix(`/auth/login`) ||
        PathPrefix(`/auth/callback`)
      service: user-service-svc
      priority: 20
      tls: {}

    # ── API Gateway (resto del tráfico va a KrakenD) ──────────────────────────
    api-http:
      entryPoints:
        - web
      rule: >-
        PathPrefix(`/api`) ||
        PathPrefix(`/auth`) ||
        PathPrefix(`/users`) ||
        PathPrefix(`/achievements`) ||
        PathPrefix(`/notifications`)
      service: api-gateway-svc
      middlewares:
        - cors-headers
      priority: 10

    api-https:
      entryPoints:
        - websecure
      rule: >-
        PathPrefix(`/api`) ||
        PathPrefix(`/auth`) ||
        PathPrefix(`/users`) ||
        PathPrefix(`/achievements`) ||
        PathPrefix(`/notifications`)
      service: api-gateway-svc
      middlewares:
        - cors-headers
      priority: 10
      tls: {}

  middlewares:
    cors-headers:
      headers:
        accessControlAllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        accessControlAllowHeaders:
          - "*"
        accessControlAllowOriginList:
          - "http://localhost:5173"
          - "http://localhost:3000"
        accessControlAllowCredentials: true
        accessControlMaxAge: 43200

  services:
    # KrakenD — API gateway para llamadas JSON del frontend
    api-gateway-svc:
      loadBalancer:
        servers:
          - url: "http://krakend:8085"

    # FastAPI user-service — directo para flujos OAuth (necesitan redirects reales)
    user-service-svc:
      loadBalancer:
        servers:
          - url: "http://component_a_1:8000"
          - url: "http://component_a_2:8000"
          - url: "http://component_a_3:8000"

    # Music service — directo para WebSocket (KrakenD no soporta WS upgrade)
    music-service-svc:
      loadBalancer:
        servers:
          - url: "http://music_service_1:8081"
          - url: "http://music_service_2:8081"
          - url: "http://music_service_3:8081"

tls:
  certificates:
    - certFile: "/etc/traefik/certs/fitbeat-server.crt"
      keyFile:  "/etc/traefik/certs/fitbeat-server.key"
  options:
    default:
      minVersion: VersionTLS12
      cipherSuites:
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384

